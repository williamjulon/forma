function renderNav(){const make=(k)=>`<button class="${route===k?'active':''}" data-route="${k}">${iconSvg(k)}<span>${names[k]}</span></button>`;document.getElementById('nav').innerHTML=Object.keys(names).map(make).join('');document.getElementById('tabbar').innerHTML=['inicio','rutina','dieta','progreso'].map(k=>`<button class="${route===k?'active':''}" data-route="${k}">${iconSvg(k)}${names[k]}</button>`).join('');document.querySelectorAll('[data-route]').forEach(e=>e.onclick=()=>{route=e.dataset.route;render();window.scrollTo({top:0,behavior:'smooth'})})}

function art(kind,i){let accent=['#b7a1ed','#edb9a1','#b2d6bb','#d9bae8','#eed09c'][i%5];let poses={thrust:['M56 97L83 73 118 73 148 94','M56 97L50 129M148 94l16 37'],press:['M86 57l18 34 30 12','M104 91l-19 35m49-23 21 31'],squat:['M99 60l4 43-24 24','M103 103l36 24'],abduct:['M99 63v45l-29 23','M99 108l45 23'],machine:['M90 65l15 43 32 16','M105 108L80 135'],pull:['M95 57v54l-28 25','M95 111l29 25'],row:['M89 66l31 32 29 10','M120 98l-10 35'],curl:['M99 58v48l-22 24','M99 106l25 24'],floor:['M65 107L103 105 138 122','M103 105l-10 29'],plank:['M41 111L105 99l56 8','M105 99l-12 35'],walk:['M98 58v48l-27 31','M98 106l39 22'],shoulder:['M99 64v47l-25 25','M99 111l27 25'],raise:['M99 62v47l-28 26','M99 109l29 26'],hinge:['M107 63l-28 45 20 27','M79 108l-22 30'],kick:['M99 63v48l-30 24','M99 111l49 2']};let paths=poses[kind]||poses.squat;let extra=kind==='thrust'?'<path d="M28 95h150" stroke="#77778c" stroke-width="7"/><rect x="75" y="83" width="56" height="11" rx="5" fill="#292d39"/>':kind==='pull'?'<path d="M35 27h129M99 27v30M57 48l42-20 42 20" stroke="#5e5b77" stroke-width="5" fill="none"/>':kind==='press'?'<path d="M68 145h90M65 62l85-31" stroke="#858296" stroke-width="6" fill="none"/>':kind==='floor'||kind==='plank'?'<path d="M20 142h165" stroke="#c4a2df" stroke-width="9"/>':kind==='curl'||kind==='raise'||kind==='hinge'?'<rect x="47" y="123" width="25" height="9" rx="3" fill="#6d6f84"/>':'';return `<svg role="img" aria-label="Ilustración esquemática de ${safe(kind)}" viewBox="0 0 200 160"><rect width="200" height="160" rx="15" fill="#faf8ff"/><circle cx="164" cy="28" r="34" fill="${accent}" opacity=".25"/><ellipse cx="105" cy="145" rx="74" ry="6" fill="#d5d0dd" opacity=".5"/>${extra}<circle cx="99" cy="43" r="16" fill="#e5aa90"/><path d="M87 38q-3-21 12-17 17 2 16 18" fill="#51404a"/><path d="${paths[0]}" stroke="#9070c4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="${paths[1]}" stroke="#5e5975" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`}
function mealIllustration(i){let m=meals[i];return `<svg role="img" aria-label="Ilustración de ${m.name.toLowerCase()}" viewBox="0 0 180 125"><ellipse cx="90" cy="71" rx="76" ry="44" fill="#000" opacity=".06"/><ellipse cx="90" cy="62" rx="68" ry="42" fill="#fff"/><ellipse cx="90" cy="62" rx="57" ry="33" fill="#e6e5dc"/><ellipse cx="72" cy="59" rx="27" ry="21" fill="${['#f5d685','#b5d8b8','#f3e4bc','#efb4a4'][i]}"/><ellipse cx="115" cy="57" rx="23" ry="18" fill="${['#fffcf1','#cd8e5a','#e4b7cd','#e7a77d'][i]}"/><path d="M55 68q21 13 34 2M100 64q18 12 30-3" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/><circle cx="82" cy="55" r="8" fill="${['#ffa92c','#7bb67a','#da688d','#85a98b'][i]}"/><path d="M142 24l11-11M35 26 23 15" stroke="#d7c4a8" stroke-width="4" stroke-linecap="round"/></svg>`}
function weekBar(){let dates=Array.from({length:7},(_,i)=>addDays(monday(),i));return `<div class="section-head"><h2>Tu semana</h2><div class="week-nav"><button class="mini-btn" data-week="-1" aria-label="Semana anterior">‹</button><span class="muted nowrap">${fmt(dates[0])} – ${fmt(dates[6])}</span><button class="mini-btn" data-week="1" aria-label="Semana siguiente">›</button></div></div><div class="grid week-grid">${WEEK.map((name,i)=>`<button class="day ${i===activeDay?'active':''}" data-day="${i}"><div class="letter">${name.substring(0,3).toUpperCase()} · ${dates[i].slice(-2)}</div><div class="emoji">${EMOJI[i]}</div><div class="day-name">${name}</div><div class="tiny">${DAYSHORT[i]}</div></button>`).join('')}</div>`}
function bindDays(){document.querySelectorAll('[data-day]').forEach(e=>e.onclick=()=>{activeDay=Number(e.dataset.day);render()});document.querySelectorAll('[data-week]').forEach(e=>e.onclick=()=>{offset+=Number(e.dataset.week);render()})}
function progress(){const count=Object.keys(db.setData).filter(k=>k.startsWith(selectedDate()+'|')&&db.setData[k]?.done).length;const total=(workout[activeDay]||[]).reduce((a,x)=>a+x.sets,0);return {count,total,pct:total?Math.round(count/total*100):0}}
function home(){let r=progress(),doneWeeks=db.sessions.length;return `<section class="hero"><div><span class="hero-tag">TU MEJOR VERSIÓN, A TU RITMO</span><h1>Más fuerza.<br>Más confianza.<br>Más tú.</h1><p>Tu plan personalizado para fortalecer piernas y glúteos, cuidar tu alimentación y celebrar cada avance.</p><button class="button" style="margin-top:17px;background:#dccbff;color:#30293e" data-go="rutina">Ver entrenamiento →</button></div><div class="hero-art">${heroIllustration()}</div></section><div class="grid stats"><div class="card"><div class="stat-label">Objetivo de proteína</div><div class="stat-value">${db.settings.protein} <small style="font-size:14px">g</small></div><div class="stat-caption">cada día · referencia</div></div><div class="card"><div class="stat-label">Entrenamientos registrados</div><div class="stat-value">${doneWeeks}</div><div class="stat-caption">sesiones guardadas</div></div><div class="card"><div class="stat-label">Entrenamiento seleccionado</div><div class="stat-value">${r.pct}%</div><div class="stat-caption">series marcadas</div></div><div class="card"><div class="stat-label">Plan de entrenamiento</div><div class="stat-value">5 + 1</div><div class="stat-caption">días de entrenamiento + zumba</div></div></div>${weekBar()}<div class="split" style="margin-top:19px"><section class="card"><div class="flex between"><h3>${EMOJI[activeDay]} ${WEEK[activeDay]} · ${DAYSHORT[activeDay]}</h3><span class="badge">${activeDay===6?'Descanso':activeDay===5?'Cardio':workout[activeDay].length+' ejercicios'}</span></div><p class="muted" style="margin-top:12px">${activeDay===6?'Día para recuperar energía, caminar suavemente si lo deseas y descansar.':activeDay===5?'Disfruta entre 30 y 60 minutos de zumba o baile según tu condición. Ajusta el ritmo si el viernes entrenaste fuerte.':'Comienza con peso cómodo. Técnica primero; termina cada serie sintiendo que podrías hacer 2–3 repeticiones más.'}</p><div class="progress-track"><div class="progress-fill" style="width:${r.pct}%"></div></div><p class="smallprint" style="margin:9px 0 18px">${r.count} de ${r.total} series completadas</p><button class="button" data-go="rutina">Abrir rutina del día →</button></section><section class="card soft-bg"><h3>♡ Enfoque de esta etapa</h3><p class="muted" style="margin-top:11px">Construir glúteos y piernas mientras reduces progresivamente grasa corporal, sin dietas extremas. Valora tus medidas y fuerza más que un número en la balanza.</p><button class="button light" style="margin-top:18px" data-go="progreso">Registrar mis medidas</button></section></div>`}
function exerciseCard(x,i){let date=selectedDate();let setHtml=Array.from({length:x.sets},(_,j)=>{let k=`${date}|${activeDay}|${i}|${j}`;let v=db.setData[k]||{};return `<div class="set"><span class="set-num">Serie ${j+1}</span><label>REPS <input type="text" maxlength="12" placeholder="${safe(x.reps)}" value="${safe(v.reps||'')}" data-setfield="reps" data-setkey="${k}"></label><label>KG <input type="number" min="0" max="600" step="0.5" placeholder="—" value="${safe(v.kg??'')}" data-setfield="kg" data-setkey="${k}"></label><button type="button" class="${v.done?'done':''}" aria-label="Marcar serie ${j+1}" data-check="${k}" title="${v.done?'Completada':'Marcar completada'}">✓</button></div>`}).join('');return `<article class="exercise"><div class="art">${art(x.kind,i)}</div><div><div class="exercise-head"><h3>${i+1}. ${safe(x.name)}</h3></div><p class="hint">${safe(x.hint)}</p><div class="chips"><span class="chip">${x.sets} series · ${x.reps}</span><span class="chip">${x.muscle}</span></div><div class="set-list">${setHtml}</div></div></article>`}
function routine(){let r=progress();return `<div class="header-row"><div><div class="eyebrow">ENTRENA CON INTENCIÓN</div><h1>Mi rutina<span style="color:#ac92eb">.</span></h1><p class="sub">Registra tus repeticiones, pesos y series completadas. Tu historial se guarda automáticamente.</p></div></div>${weekBar()}<div class="section-head"><div><h2>${EMOJI[activeDay]} ${WEEK[activeDay]} · ${DAYSHORT[activeDay]}</h2><p>${fmt(selectedDate())}</p></div>${activeDay<5?`<span class="pill">${r.count}/${r.total} series</span>`:''}</div>${activeDay===5?`<section class="card"><div style="font-size:53px">💃</div><h2 style="margin:10px 0">¡Día de zumba!</h2><p class="muted">30–60 minutos de baile o cardio a intensidad cómoda. También cuenta como actividad. Si sigues fatigada del viernes, baja el ritmo o descansa.</p><div class="flex" style="margin-top:19px;flex-wrap:wrap"><label class="input-field" style="max-width:140px">Minutos <input id="danceMinutes" type="number" min="0" max="240" value="45"></label><button class="button" id="saveDance">Registrar zumba</button></div></section>`:activeDay===6?`<section class="card"><div style="font-size:53px">🧘</div><h2>Descanso y recuperación</h2><p class="muted">Recupera energía, duerme bien e hidrátate. El descanso también forma parte del progreso.</p></section>`:`<div class="notice" style="margin-bottom:17px">✨ <b>Primeras 2 semanas:</b> puedes hacer solo 1–2 series por ejercicio. Luego aumenta gradualmente. Descansa 90–120 s en ejercicios principales y 60–90 s en accesorios.</div><div class="grid rows">${workout[activeDay].map(exerciseCard).join('')}</div><div class="card" style="margin-top:17px"><div class="flex between"><div><h3>Tu avance de hoy</h3><p class="muted">${r.count} de ${r.total} series completadas</p></div><span class="stat-value">${r.pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${r.pct}%"></div></div><button class="button" style="margin-top:17px" id="finishWorkout">Guardar sesión en historial</button></div>`}`}
function diet(){let day=iso(),selected=db.meals[day]||[];let consumed=selected.reduce((t,i)=>t+meals[i].protein,0);return `<div class="eyebrow">NUTRE TU PROGRESO</div><h1>Mi alimentación<span style="color:#ac92eb">.</span></h1><p class="sub">Una guía flexible para recomposición corporal. No hace falta eliminar arroz, papa, pan ni otros alimentos que disfrutas.</p><div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><div class="stat-label">Proteína objetivo</div><div class="stat-value">${db.settings.protein} g</div><div class="stat-caption">Aprox. 100–120 g al día es una referencia útil</div></div><div class="card"><div class="stat-label">Proteína registrada hoy</div><div class="stat-value">~${consumed} g</div><div class="stat-caption">Estimación de comidas marcadas, no medición real</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,consumed/db.settings.protein*100)}%"></div></div></div></div><div class="notice">🍽️ <b>Calorías:</b> rango de mantenimiento orientativo 1,800–2,100 kcal/día según tu actividad. El valor de referencia configurable (${db.settings.calories} kcal) no es una indicación de comer exactamente esa cantidad. Ajusta según evolución y, si puedes, con orientación nutricional.</div><div class="section-head"><h2>Ideas de comidas</h2><p>Marca lo que comiste hoy · ${fmt(day)}</p></div><div class="grid meal-grid">${meals.map((m,i)=>`<article class="card meal"><div class="meal-top" style="background:${m.color}">${mealIllustration(i)}</div><div class="meal-content"><div class="flex between"><h3 class="meal-name">${m.name} ${m.emoji}</h3><span class="chip">~${m.protein} g proteína</span></div><ul class="food-lines">${m.foods.map(f=>`<li>${f}</li>`).join('')}</ul><p class="smallprint">${m.tip}</p><label class="check-row ${selected.includes(i)?'meal-checked':''}"><input type="checkbox" data-meal="${i}" ${selected.includes(i)?'checked':''}> Consumí una comida similar hoy</label></div></article>`).join('')}</div><div class="section-head"><h2>Principios de tu alimentación</h2></div><div class="grid meal-grid"><div class="card"><h3>🥩 Proteína suficiente</h3><p class="muted" style="margin-top:10px">Apunta aproximadamente a 110 g/día. Puedes obtenerlos con huevos, yogur, pollo, pescado, legumbres, tofu o lácteos.</p></div><div class="card"><h3>🥔 Energía para entrenar</h3><p class="muted" style="margin-top:10px">Incluye carbohidratos y grasas saludables. Comer demasiado poco puede dificultar el crecimiento muscular y la recuperación.</p></div><div class="card"><h3>🥑 Flexibilidad</h3><p class="muted" style="margin-top:10px">No hay alimentos prohibidos. La constancia y las porciones totales importan más que un menú rígido.</p></div><div class="card"><h3>📏 La cintura cambia con el tiempo</h3><p class="muted" style="margin-top:10px">No existe reducción localizada de grasa. El entrenamiento, la actividad general y la alimentación trabajan juntos.</p></div></div>`}
function svgChart(rows,field){let data=rows.filter(x=>Number.isFinite(+x[field])&&x[field]!==''&&x[field]!==null).slice(-12);if(!data.length)return `<div class="empty"><div class="e">📈</div>Registra al menos una medición para ver tu evolución.</div>`;let vals=data.map(x=>+x[field]),mn=Math.min(...vals),mx=Math.max(...vals),rng=Math.max(2,mx-mn),lo=mn-rng*.18,hi=mx+rng*.18;let pts=vals.map((n,i)=>[30+i*(570/Math.max(1,vals.length-1)),178-(n-lo)/(hi-lo)*140]);let path=pts.map((p,i)=>`${i?'L':'M'} ${p.join(' ')}`).join(' ');return `<svg class="chart" viewBox="0 0 630 210" role="img" aria-label="Gráfico de evolución de ${field}"><path d="M30 30H610 M30 100H610 M30 178H610" stroke="#ededf0" stroke-width="1"/><path d="${path}" stroke="#a287e8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="#9074df" stroke-width="3"><title>${fmt(data[i].date)}: ${vals[i]} ${field==='weight'?'kg':'cm'}</title></circle>`).join('')}<text x="30" y="202" fill="#93939d" font-size="12">${fmt(data[0].date)}</text><text x="608" y="202" text-anchor="end" fill="#93939d" font-size="12">${fmt(data[data.length-1].date)}</text></svg>`}
function progressPage(){let ms=[...db.measurements].sort((a,b)=>a.date.localeCompare(b.date));let recent=ms.at(-1);return `<div class="eyebrow">TU CAMINO, TUS LOGROS</div><h1>Mi progreso<span style="color:#ac92eb">.</span></h1><p class="sub">El peso no lo cuenta todo. Revisa también tu cintura, caderas, fuerza y cómo te sientes.</p><div class="section-head"><h2>Registrar medidas</h2><p>Idealmente cada 2–4 semanas</p></div><form id="measureForm" class="card"><div class="form-grid"><label class="input-field">Fecha<input type="date" name="date" required value="${iso()}"></label><label class="input-field">Peso (kg)<input type="number" step="0.1" min="20" max="300" name="weight" placeholder="62.0"></label><label class="input-field">Cintura (cm)<input type="number" step="0.1" min="30" max="200" name="waist" placeholder="Ej. 75"></label><label class="input-field">Cadera (cm)<input type="number" step="0.1" min="40" max="220" name="hip" placeholder="Ej. 99"></label><label class="input-field">Notas<input name="note" maxlength="120" placeholder="Energía, descanso..."></label></div><button class="button" style="margin-top:18px" type="submit">Guardar medidas</button></form><div class="section-head"><h2>Gráficos de evolución</h2></div><div class="grid meal-grid"><div class="card"><h3>↘ Cintura (cm)</h3>${svgChart(ms,'waist')}</div><div class="card"><h3>↗ Cadera (cm)</h3>${svgChart(ms,'hip')}</div><div class="card"><h3>⚖️ Peso (kg)</h3>${svgChart(ms,'weight')}</div><div class="card"><h3>📍 Último registro</h3>${recent?`<div class="stats" style="display:grid;grid-template-columns:repeat(2,1fr);margin:20px 0"><div><div class="stat-label">Peso</div><div class="stat-value">${recent.weight||'—'}</div></div><div><div class="stat-label">Cintura</div><div class="stat-value">${recent.waist||'—'}</div></div><div><div class="stat-label">Cadera</div><div class="stat-value">${recent.hip||'—'}</div></div><div><div class="stat-label">Fecha</div><strong>${fmt(recent.date)}</strong></div></div><p class="muted">Compara mediciones tomadas en condiciones similares.</p>`:'<div class="empty">Aún no tienes mediciones.</div>'}</div></div><div class="section-head"><h2>Historial de entrenamientos</h2></div><div class="card">${db.sessions.length?db.sessions.slice().reverse().map((x,i)=>`<div class="log"><div><strong>${safe(x.label)}</strong><small>${fmt(x.date)} · ${safe(x.detail||'Sesión registrada')}</small></div><button class="button light" data-delete-session="${db.sessions.length-1-i}">Eliminar</button></div>`).join(''):'<div class="empty"><div class="e">🏋️</div>Guarda una sesión desde la pantalla Mi rutina para verla aquí.</div>'}</div><div class="section-head"><h2>Historial de medidas</h2></div><div class="card">${ms.length?ms.slice().reverse().map(x=>`<div class="log"><div><strong>${fmt(x.date)}</strong><small>Peso: ${x.weight||'—'} kg · Cintura: ${x.waist||'—'} cm · Cadera: ${x.hip||'—'} cm ${x.note?'· '+safe(x.note):''}</small></div><button class="button light" data-delete-measure="${x.id}">Eliminar</button></div>`).join(''):'<div class="empty">No hay medidas registradas.</div>'}</div>`}
function settingsPage(){return `<div class="eyebrow">A TU MANERA</div><h1>Mis ajustes<span style="color:#ac92eb">.</span></h1><p class="sub">Personaliza tus referencias y gestiona tus datos.</p><div class="section-head"><h2>Objetivos orientativos</h2></div><form class="card" id="settingsForm"><div class="form-grid"><label class="input-field">Proteína diaria (g)<input type="number" name="protein" min="30" max="250" required value="${db.settings.protein}"></label><label class="input-field">Calorías referencia (kcal)<input type="number" name="calories" min="1000" max="5000" required value="${db.settings.calories}"></label></div><p class="smallprint" style="margin-top:12px">Estos valores son referencias configurables y no sustituyen asesoramiento profesional.</p><button class="button" style="margin-top:17px">Guardar preferencias</button></form><div class="section-head"><h2>Tus datos, tu control</h2></div><div class="card"><h3>🔒 Almacenamiento local</h3><p class="muted" style="margin:12px 0">Esta app usa <b>localStorage</b> (no una base de datos en Vercel). Tus datos permanecen únicamente en el navegador y dispositivo que utilizas. Si borras los datos del sitio, usas incógnito o cambias de dispositivo, no se sincronizarán. Una copia JSON te permite restaurarlos manualmente.</p><div class="flex" style="flex-wrap:wrap;margin-top:17px"><button class="button" id="exportBtn">↓ Exportar respaldo JSON</button><button class="button soft" id="importBtn">↑ Importar respaldo</button><button class="button danger" id="clearBtn">Borrar datos</button></div></div><div class="section-head"><h2>Consejos importantes</h2></div><div class="card"><p class="muted">• Si eres principiante, prioriza una ejecución supervisada y cómoda.<br>• No es necesario llegar al fallo muscular en cada serie.<br>• Dolor agudo, mareo o malestar: detén el ejercicio y consulta.<br>• El crecimiento muscular y la reducción de grasa son graduales; no hay garantía de una forma corporal concreta.<br>• Las ilustraciones son esquemáticas, no instrucciones biomecánicas completas.</p></div>`}
function render(){document.getElementById('todayPill').textContent=new Date().toLocaleDateString('es-PE',{day:'numeric',month:'short'});renderNav();document.getElementById('page').innerHTML=route==='inicio'?home():route==='rutina'?routine():route==='dieta'?diet():route==='progreso'?progressPage():settingsPage();bindDays();document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{route=x.dataset.go;render();window.scrollTo(0,0)});bindPage()}
function bindPage(){document.querySelectorAll('[data-setfield]').forEach(el=>el.addEventListener('change',()=>{let k=el.dataset.setkey;db.setData[k]??={};db.setData[k][el.dataset.setfield]=el.value;save()}));document.querySelectorAll('[data-check]').forEach(el=>el.onclick=()=>{let k=el.dataset.check;db.setData[k]??={};db.setData[k].done=!db.setData[k].done;save();render()});document.querySelectorAll('[data-meal]').forEach(el=>el.onchange=()=>{let d=iso();let s=db.meals[d]||[];let i=+el.dataset.meal;db.meals[d]=el.checked?[...new Set([...s,i])]:s.filter(x=>x!==i);save();render()});let finish=document.getElementById('finishWorkout');if(finish)finish.onclick=()=>{let p=progress();if(!p.count)return toast('Marca al menos una serie completada primero.');let date=selectedDate(),id=`${date}-${activeDay}`;let sess={id,date,label:`${WEEK[activeDay]} · ${DAYSHORT[activeDay]}`,detail:`${p.count}/${p.total} series`};let found=db.sessions.findIndex(s=>s.id===id);if(found>=0)db.sessions[found]=sess;else db.sessions.push(sess);save();toast('Sesión guardada en tu historial ✨')};let dance=document.getElementById('saveDance');if(dance)dance.onclick=()=>{let min=+document.getElementById('danceMinutes').value;if(min<1||min>240)return toast('Introduce entre 1 y 240 minutos.');let date=selectedDate(),id=`${date}-5`,sess={id,date,label:'Sábado · Zumba',detail:`${min} min de baile`},f=db.sessions.findIndex(s=>s.id===id);if(f>=0)db.sessions[f]=sess;else db.sessions.push(sess);save();toast('¡Zumba registrada! 💃')};let form=document.getElementById('measureForm');if(form)form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));if(!d.weight&&!d.waist&&!d.hip)return toast('Ingresa al menos una medida.');db.measurements.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),...d});save();render();toast('Medidas guardadas ✨')};document.querySelectorAll('[data-delete-measure]').forEach(el=>el.onclick=()=>{if(!confirm('¿Eliminar esta medición?'))return;db.measurements=db.measurements.filter(x=>x.id!==el.dataset.deleteMeasure);save();render()});document.querySelectorAll('[data-delete-session]').forEach(el=>el.onclick=()=>{if(!confirm('¿Eliminar este registro de sesión?'))return;db.sessions.splice(+el.dataset.deleteSession,1);save();render()});let settings=document.getElementById('settingsForm');if(settings)settings.onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(settings));db.settings.protein=+data.protein;db.settings.calories=+data.calories;save();toast('Preferencias guardadas')};let exportBtn=document.getElementById('exportBtn');if(exportBtn)exportBtn.onclick=()=>{let data=JSON.stringify({app:'forma',version:1,exported:new Date().toISOString(),data:db},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`forma-respaldo-${iso()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};let importBtn=document.getElementById('importBtn');if(importBtn)importBtn.onclick=()=>document.getElementById('restore').click();let clear=document.getElementById('clearBtn');if(clear)clear.onclick=()=>{if(!confirm('Se eliminarán TODOS los datos guardados en este navegador. ¿Continuar?'))return;db=initial();save();render();toast('Datos reiniciados')};}
document.getElementById('restore').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(parsed.app!=='forma'||!parsed.data||!Array.isArray(parsed.data.sessions)||!Array.isArray(parsed.data.measurements)||typeof parsed.data.setData!=='object'||typeof parsed.data.meals!=='object')throw Error();if(!confirm('Esta importación reemplazará los datos actuales. ¿Continuar?'))return;db={...initial(),...parsed.data,settings:{...initial().settings,...parsed.data.settings}};save();render();toast('Respaldo restaurado correctamente')}catch{toast('No se pudo importar: archivo inválido')}finally{e.target.value=''}});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
